sonar.organization=muhammadlazaro
sonar.projectKey=SIMPA
sonar.projectVersion=1.0.0

sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/src/tests
sonar.exclusions=**/vendor/**,**/node_modules/**,**/storage/**,**/bootstrap/cache/**,**/*.min.js,**/*.min.css
sonar.test.inclusions=backend/tests/**/*.php,frontend/src/tests/**/*.js,frontend/src/tests/**/*.ts
sonar.php.file.suffixes=php
sonar.javascript.file.suffixes=.js,.vue

sonar.php.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# DataTable receives semantic thead/th markup through its default Vue slot.
# Sonar's HTML analyzer cannot resolve that cross-component composition.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=Web:S5256
sonar.issue.ignore.multicriteria.e1.resourceKey=frontend/src/components/DataTable.vue

sonar.sourceEncoding=UTF-8
