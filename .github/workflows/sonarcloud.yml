name: SonarCloud Analysis

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: xdebug
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare backend test environment
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run backend tests with coverage
        working-directory: backend
        run: php artisan test --coverage-clover=coverage.xml

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm run test -- --coverage --coverage.reporter=lcov --coverage.reporter=text

      - name: Lint and build frontend
        working-directory: frontend
        run: |
          npm run lint
          npm run build

      - name: SonarCloud Scan
        id: sonarcloud-scan
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Publish SonarCloud result summary
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: SIMPA
        shell: bash
        run: |
          set -euo pipefail

          auth_header="Authorization: Bearer ${SONAR_TOKEN}"
          issues_url="https://sonarcloud.io/api/issues/search?componentKeys=${SONAR_PROJECT_KEY}&branch=master&resolved=false&ps=1&facets=impactSeverities"
          medium_issues_url="https://sonarcloud.io/api/issues/search?componentKeys=${SONAR_PROJECT_KEY}&branch=master&resolved=false&impactSeverities=MEDIUM&ps=100&p=1"
          gate_url="https://sonarcloud.io/api/qualitygates/project_status?projectKey=${SONAR_PROJECT_KEY}&branch=master"
          analyses_url="https://sonarcloud.io/api/project_analyses/search?project=${SONAR_PROJECT_KEY}&branch=master&ps=1"
          coverage_url="https://sonarcloud.io/api/measures/component_tree?component=${SONAR_PROJECT_KEY}&branch=master&metricKeys=new_coverage,new_lines_to_cover,new_uncovered_lines&qualifiers=FIL&ps=500"

          curl --fail --silent --show-error \
            --header "${auth_header}" \
            "${issues_url}" \
            --output sonar-issues-summary.json
          curl --fail --silent --show-error \
            --header "${auth_header}" \
            "${medium_issues_url}" \
            --output sonar-medium-issues.json
          curl --fail --silent --show-error \
            --header "${auth_header}" \
            "${gate_url}" \
            --output sonar-quality-gate.json
          curl --fail --silent --show-error \
            --header "${auth_header}" \
            "${analyses_url}" \
            --output sonar-latest-analysis.json
          curl --fail --silent --show-error \
            --header "${auth_header}" \
            "${coverage_url}" \
            --output sonar-coverage-components.json

          {
            echo "## SonarCloud analysis summary"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Quality Gate: **$(jq -r '.projectStatus.status' sonar-quality-gate.json)**"
            echo "- Open issues: **$(jq -r '.total' sonar-issues-summary.json)**"
            echo
            echo "### Impact severity"
            jq -r '
              .facets[]
              | select(.property == "impactSeverities")
              | .values[]
              | "- \(.val): **\(.count)**"
            ' sonar-issues-summary.json
            echo
            echo "### First 100 open Medium issues"
            jq -r '
              .issues[]
              | "- `\(.component | sub("^[^:]+:"; "")):\(.line // 1)` [\(.rule)] \(.message)"
            ' sonar-medium-issues.json
            echo
            echo "### Failed Quality Gate conditions"
            jq -r '
              .projectStatus.conditions[]
              | select(.status != "OK")
              | "- \(.metricKey): status **\(.status)**, actual \(.actualValue // "n/a"), threshold \(.errorThreshold // "n/a")"
            ' sonar-quality-gate.json
            echo
            echo "### Latest processed analysis"
            jq -r '
              if (.analyses | length) > 0 then
                "- Revision: `\(.analyses[0].revision // "unknown")`"
              else
                "- No processed analysis returned."
              end
            ' sonar-latest-analysis.json
            echo
            echo "### Largest new-code coverage gaps"
            jq -r '
              [
                .components[]
                | {
                    path,
                    uncovered: (
                      [
                        .measures[]
                        | select(.metric == "new_uncovered_lines")
                        | (.value // .period.value // .periods[0].value)
                      ][0]
                      // "0"
                      | tonumber
                    ),
                    lines: (
                      [
                        .measures[]
                        | select(.metric == "new_lines_to_cover")
                        | (.value // .period.value // .periods[0].value)
                      ][0]
                      // "0"
                      | tonumber
                    )
                  }
                | select(.uncovered > 0)
              ]
              | sort_by(-.uncovered)
              | .[:20][]
              | "- `\(.path)`: \(.uncovered) uncovered of \(.lines) new lines"
            ' sonar-coverage-components.json
          } | tee -a "${GITHUB_STEP_SUMMARY}"
